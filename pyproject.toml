[project]
name = "multi-mp3"
version = "1.0.0"
description = "Dockerized CLI tool to download music from Spotify, YouTube, and SoundCloud"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "spotdl>=4.0.0",
    "spotipy>=2.24.0",
    "python-dotenv>=1.0.0",
    "yt-dlp>=2024.0.0",
    "scdl>=2.0.0",
    "psutil>=5.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "black>=24.0.0",
    "pytest>=8.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
