<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ name }} — Multi-MP3</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>📁 {{ name }}</h1>
  <a href="/" class="back-link">← Back</a>
</header>

<main>
  <div class="panel">
    <h2>Tracks ({{ tracks|length }})</h2>
    {% if tracks %}
    <table>
      <tr><th>#</th><th>Title</th><th>Size</th><th></th></tr>
      {% for track in tracks %}
      <tr>
        <td>{{ loop.index }}</td>
        <td>{{ track.name }}</td>
        <td>{{ track.size_mb }} MB</td>
        <td><audio controls src="/api/files/{{ track.path }}/download" style="height:28px;width:300px"></audio></td>
      </tr>
      {% endfor %}
    </table>
    {% else %}
    <p class="muted">No tracks found in this playlist.</p>
    {% endif %}
  </div>
</main>
</body>
</html>
